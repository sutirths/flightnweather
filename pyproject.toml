[project]
name = "flight-weather-lakehouse"
version = "0.1.0"
description = "Production-style flight and weather data lakehouse"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Your Name"}]
dependencies = [
  "boto3>=1.34,<2",
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "python-dateutil>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25,<4", "pyarrow>=17,<20"]
dbt = ["dbt-duckdb>=1.8,<2"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
flight-weather = "flight_weather_lakehouse.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

