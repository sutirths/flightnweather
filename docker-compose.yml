services:
  api:
    build: .
    command: uvicorn flight_weather_lakehouse.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/app/data"]
    depends_on: [pipeline]
  pipeline:
    build: .
    command: flight-weather pipeline
    env_file: .env
    volumes: ["./data:/app/data"]

